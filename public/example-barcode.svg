<svg width="300" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer dashed border with margin -->
  <rect x="10" y="10" width="280" height="130" fill="none" stroke="blue" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  <!-- Barcode lines: 5 lines evenly spaced, centered in the rectangle -->
  <line x1="70" y1="15" x2="70" y2="140" stroke="blue" stroke-width="2" opacity="0.5"/>
  <line x1="110" y1="15" x2="110" y2="140" stroke="blue" stroke-width="2" opacity="0.5"/>
  <line x1="150" y1="15" x2="150" y2="140" stroke="blue" stroke-width="2" opacity="0.5"/>
  <line x1="190" y1="15" x2="190" y2="140" stroke="blue" stroke-width="2" opacity="0.5"/>
  <line x1="230" y1="15" x2="230" y2="140" stroke="blue" stroke-width="2" opacity="0.5"/>
</svg>
