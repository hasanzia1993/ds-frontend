<svg width="300" height="100" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
  <!-- License plate background -->
  <rect x="2" y="2" width="296" height="96" rx="8" fill="#1a1a1a" stroke="#404040" stroke-width="2"/>
  
  <!-- Subtle texture overlay -->
  <defs>
    <pattern id="texture" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.5" fill="#2a2a2a" opacity="0.3"/>
    </pattern>
  </defs>
  <rect x="4" y="4" width="292" height="92" rx="6" fill="url(#texture)"/>
  
  <!-- Corner screw holes -->
  <ellipse cx="20" cy="20" rx="6" ry="4" fill="#808080"/>
  <ellipse cx="280" cy="20" rx="6" ry="4" fill="#808080"/>
  <ellipse cx="20" cy="80" rx="6" ry="4" fill="#808080"/>
  <ellipse cx="280" cy="80" rx="6" ry="4" fill="#808080"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="284" height="84" rx="4" fill="none" stroke="#505050" stroke-width="1" opacity="0.5"/>
</svg>

